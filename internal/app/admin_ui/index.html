<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gemini-web2api Admin Panel</title>
<!-- Chart.js embedded with binary -->
<script src="chart.umd.min.js"></script>
<style>
  :root {
    --g-blue: #4285F4;
    --g-purple: #9B72CB;
    --g-pink: #D96570;
    --g-sweep: linear-gradient(90deg, #4285F4 0%, #9B72CB 58%, #D96570 100%);

    --bg: #F8FAFD;
    --card: #FFFFFF;
    --surface-hi: #EFF3FA;
    --surface-press: #E2E8F1;
    --outline: #D5DAE1;
    --outline-soft: #E8ECF1;
    --nav-on: #D3E3FD;
    --nav-on-fg: #0B57D0;

    --text: #1F1F1F;
    --text-2: #3C4043;
    --muted: #5F6368;
    --ok: #146C2E;
    --ok-bg: #E6F4EA;
    --fail: #B3261E;
    --fail-bg: #FCEEEE;
    --warn: #8F5000;
    --warn-bg: #FDF0E0;

    --sb-w: 244px;
    --sb-w-collapsed: 72px;
    --topbar-h: 60px;
    --r-card: 16px;
    --r-pill: 999px;
    --sans: "Google Sans Text", "Google Sans", "Product Sans", -apple-system,
            BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: "Roboto Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
    --shadow: 0 1px 2px rgba(60,64,67,.06), 0 1px 3px 1px rgba(60,64,67,.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--sans); background: var(--bg); color: var(--text);
    font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  #app { display: flex; min-height: 100vh; }
  ::selection { background: var(--nav-on); }

  /* Sidebar */
  .sidebar {
    width: var(--sb-w); flex: 0 0 var(--sb-w); padding: 10px 12px 14px;
    display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh;
    transition: width .2s cubic-bezier(.2,0,0,1), flex-basis .2s cubic-bezier(.2,0,0,1);
  }
  .sidebar.collapsed { width: var(--sb-w-collapsed); flex-basis: var(--sb-w-collapsed); }
  .side-top { display: flex; align-items: center; gap: 6px; height: var(--topbar-h); }
  .icon-btn {
    all: unset; cursor: pointer; width: 40px; height: 40px; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--r-pill); color: var(--text-2); transition: background .15s;
  }
  .icon-btn:hover { background: var(--surface-press); }
  .icon-btn:focus-visible { outline: 2px solid var(--g-blue); outline-offset: 2px; }
  .brand-text {
    display: flex; align-items: center; gap: 9px; font-size: 15px;
    color: var(--text-2); white-space: nowrap; overflow: hidden;
  }
  .spark {
    width: 20px; height: 20px; flex: none; background: var(--g-sweep);
    clip-path: polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);
  }
  .sidebar.collapsed .brand-text { display: none; }

  .sidebar nav { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
  .sidebar nav button {
    all: unset; cursor: pointer; display: flex; align-items: center; gap: 14px;
    padding: 10px 16px; border-radius: var(--r-pill); color: var(--text-2);
    font-size: 14px; font-family: var(--sans); white-space: nowrap;
    transition: background .15s;
  }
  .sidebar nav button svg { width: 20px; height: 20px; flex: none; fill: currentColor; opacity: .75; }
  .sidebar nav button:hover { background: var(--surface-press); }
  .sidebar nav button.active { background: var(--nav-on); color: var(--nav-on-fg); font-weight: 500; }
  .sidebar nav button.active svg { opacity: 1; }
  .sidebar nav button:focus-visible { outline: 2px solid var(--g-blue); outline-offset: 2px; }
  .sidebar.collapsed nav button { justify-content: center; padding: 10px 0; }
  .sidebar.collapsed .nav-label { display: none; }

  .side-foot { margin-top: auto; padding: 12px 16px 2px; font-size: 12px; color: var(--muted); }
  .side-foot .sf-row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
  .side-foot .sf-row b { color: var(--text-2); font-weight: 500; }
  .sf-sep { height: 1px; background: var(--outline-soft); margin: 9px 0; }
  .logout-btn {
    all: unset; box-sizing: border-box; cursor: pointer; width: 100%;
    display: flex; align-items: center; gap: 13px; padding: 9px 14px;
    border-radius: var(--r-pill); color: var(--muted); font-size: 13px;
    font-family: var(--sans); transition: background .15s, color .15s;
  }
  .logout-btn svg { width: 18px; height: 18px; flex: none; fill: currentColor; }
  .logout-btn:hover { background: var(--fail-bg); color: var(--fail); }
  .logout-btn:focus-visible { outline: 2px solid var(--g-blue); outline-offset: 2px; }
  .sidebar.collapsed .side-foot { padding: 12px 8px 2px; }
  .sidebar.collapsed #sideStat, .sidebar.collapsed .sf-sep { display: none; }
  .sidebar.collapsed .logout-btn { justify-content: center; padding: 9px 0; }

  /* Content area */
  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    height: var(--topbar-h); flex: none; display: flex; align-items: center;
    justify-content: space-between; gap: 16px; padding: 0 24px;
    position: sticky; top: 0; z-index: 10; background: var(--bg);
  }
  .page-title { font-size: 20px; font-weight: 400; letter-spacing: -.01em; color: var(--text); }
  .topbar-right { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok);
         box-shadow: 0 0 0 3px rgba(20,108,46,.14); }
  .dot.bad { background: var(--fail); box-shadow: 0 0 0 3px rgba(179,38,30,.14); }

  main { flex: 1; padding: 4px 24px 36px; min-width: 0; }
  h2 {
    font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 14px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; min-height: 32px;
  }

  /* Cards */
  .panel, .card {
    background: var(--card); border-radius: var(--r-card);
    padding: 20px 22px; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .grid-main { display: grid; grid-template-columns: minmax(0,2fr) minmax(310px,1fr);
               gap: 14px; margin-bottom: 14px; align-items: start; }
  .grid-2 > *, .grid-main > * { margin-bottom: 0; }
  .stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .stack > * { margin-bottom: 0; }

  /* KPI */
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr));
             gap: 14px; margin-bottom: 14px; }
  .kpi { background: var(--card); border-radius: var(--r-card); padding: 15px 18px;
         box-shadow: var(--shadow); }
  .kpi .label { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .kpi .value { font-size: 27px; font-weight: 400; letter-spacing: -.02em;
                line-height: 1.2; color: var(--text); font-variant-numeric: tabular-nums; }
  .kpi .sub { color: var(--muted); font-size: 11.5px; margin-top: 3px; }

  /* Tables */
  table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px;
       padding: 9px 10px; border-bottom: 1px solid var(--outline-soft); white-space: nowrap; }
  td { padding: 11px 10px; border-bottom: 1px solid var(--outline-soft);
       vertical-align: top; overflow-wrap: anywhere; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #F6F9FE; }
  tbody tr.row-dead { background: var(--fail-bg); box-shadow: inset 3px 0 0 var(--fail); }
  td.nw, th.nw { white-space: nowrap; overflow-wrap: normal; }
  td.num { font-variant-numeric: tabular-nums; }
  .empty { text-align: center; color: var(--muted); padding: 36px 0; }

  /* Buttons */
  .btn, .controls button, button.btn {
    all: unset; box-sizing: border-box;
    cursor: pointer; font-family: var(--sans); font-size: 13px;
    padding: 8px 18px; border-radius: var(--r-pill); white-space: nowrap;
    background: var(--nav-on); color: var(--nav-on-fg); font-weight: 500;
    transition: background .15s;
  }
  .btn:hover { background: #C2D8FA; }
  .btn:focus-visible { outline: 2px solid var(--g-blue); outline-offset: 2px; }
  .btn.muted { background: var(--surface-hi); color: var(--text-2); font-weight: 400; }
  .btn.muted:hover { background: var(--surface-press); }
  .btn.danger { background: transparent; color: var(--fail); box-shadow: inset 0 0 0 1px var(--outline); }
  .btn.danger:hover { background: var(--fail-bg); }
  .btn[disabled] { opacity: .38; cursor: default; pointer-events: none; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .controls button { background: var(--surface-hi); color: var(--text-2);
                     font-weight: 400; padding: 7px 15px; }
  .controls button:hover { background: var(--surface-press); }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }

  select, input[type=text], input[type=password], input[type=number], textarea {
    font-family: var(--sans); font-size: 13px; color: var(--text);
    background: var(--surface-hi); border: 1px solid transparent;
    border-radius: 10px; padding: 8px 12px; outline: none; transition: all .15s;
  }
  select:focus, input:focus, textarea:focus {
    background: var(--card); border-color: var(--g-blue);
    box-shadow: 0 0 0 3px rgba(66,133,244,.15);
  }
  .controls select { padding: 6px 10px; font-size: 12.5px; }

  /* Badges */
  .badge {
    display: inline-block; padding: 2px 9px; border-radius: var(--r-pill);
    font-size: 11.5px; font-weight: 500; white-space: nowrap;
    background: var(--surface-hi); color: var(--text-2);
  }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.fail { background: var(--fail-bg); color: var(--fail); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.muted { background: var(--surface-press); color: var(--muted); }
  .badge.blue { background: #E8F0FE; color: #1967D2; font-weight: 600; }
  .badge.purple { background: #F3E8FD; color: #7627BB; font-weight: 600; }
  .badge.green { background: var(--ok-bg); color: var(--ok); font-weight: 600; }
  .badge.red { background: var(--fail-bg); color: var(--fail); font-weight: 600; }

  .user-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 4px 12px;
    border-radius: var(--r-pill);
    background: var(--card);
    border: 1px solid var(--outline);
    color: var(--text);
    box-shadow: var(--shadow);
    font-size: 13px;
  }

  .pre {
    font-family: var(--mono); font-size: 12px; background: var(--surface-hi);
    padding: 8px 10px; border-radius: 8px; overflow-x: auto;
    white-space: pre-wrap; word-break: break-all;
  }
  .err { color: var(--fail); }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .card-desc { font-size: 12.5px; color: var(--muted); margin: -4px 0 16px; }

  .kv { display: grid; grid-template-columns: 140px 1fr; gap: 8px 16px;
        font-size: 13px; margin-top: 12px; }
  .kv > div { padding: 6px 0; border-bottom: 1px solid var(--outline-soft); }
  .kv > div:nth-last-child(-n+2) { border-bottom: none; }
  .hint { color: var(--muted); font-size: 11.5px; line-height: 1.5; margin-top: 4px; }

  details.note {
    background: var(--surface-hi); border-radius: 12px;
    padding: 10px 14px; font-size: 12px; color: var(--muted);
  }
  details.note summary {
    cursor: pointer; font-weight: 500; color: var(--text-2);
    user-select: none; outline: none;
  }
  details.note .body { margin-top: 8px; line-height: 1.6; }

  /* Runtime settings form */
  .rt-group { margin-bottom: 22px; }
  .rt-group:last-child { margin-bottom: 0; }
  .rt-group-title {
    font-size: 12px; font-weight: 500; color: var(--muted);
    letter-spacing: .02em; padding-bottom: 8px; margin-bottom: 12px;
    border-bottom: 1px solid var(--outline-soft);
  }
  .rt-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px 18px; align-items: start;
  }
  .rt-field { display: flex; flex-direction: column; min-width: 0; }
  .rt-field label {
    font-size: 12px; color: var(--text-2); margin-bottom: 5px; font-weight: 500;
  }
  .rt-field input[type=number], .rt-field input[type=text], .rt-field select {
    width: 100%; height: 36px; padding: 0 10px;
  }
  .rt-field.checkbox { flex-direction: row; align-items: center; gap: 10px;
                       margin-top: 25px; }
  .rt-field.checkbox label { margin-bottom: 0; cursor: pointer; }
  .rt-field.checkbox input[type=checkbox] {
    width: 16px; height: 16px; accent-color: var(--g-blue); cursor: pointer;
  }
  .rt-field .hint { margin-top: 5px; font-size: 11px; line-height: 1.45; }

  /* Signature track */
  .slot-scroll { max-height: 360px; overflow-y: auto; }
  .slot { padding: 12px 0; border-bottom: 1px solid var(--outline-soft); }
  .slot:last-child { border-bottom: none; }
  .slot-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .slot-name { font-weight: 500; color: var(--text); }
  .slot-count { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .slot-count b { color: var(--text); font-weight: 500; }
  .track {
    position: relative; height: 10px; background: var(--surface-hi);
    border-radius: var(--r-pill); overflow: hidden;
  }
  .track .fill { height: 100%; border-radius: var(--r-pill); background: var(--g-sweep);
                 transition: width .3s; }
  .track .redline {
    position: absolute; top: 0; bottom: 0; width: 2px;
    background: var(--fail); box-shadow: 0 0 4px var(--fail);
  }
  .slot-note { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  .slot-note.warn { color: var(--warn); }
  .slot-note.danger { color: var(--fail); font-weight: 500; }

  /* Charts */
  .chart-wrap { position: relative; height: 260px; width: 100%; }

  .scroll-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  /* Login */
  .login-box {
    width: 380px; max-width: 90vw; margin: auto; align-self: center;
    background: var(--card); border-radius: 24px; padding: 36px 32px 32px;
    box-shadow: 0 4px 20px rgba(60,64,67,.08); text-align: center;
  }
  .login-box .brand {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 19px; font-weight: 400; color: var(--text); margin-bottom: 6px;
  }
  .login-form { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
  .login-form input { width: 100%; height: 42px; text-align: center; font-size: 14px; }
  .login-form button { width: 100%; height: 42px; font-size: 14px; }

  /* Modals */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(31,31,31,.4);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 16px;
  }
  .modal {
    background: var(--card); border-radius: 20px; padding: 24px 26px;
    width: min(480px, 94vw); max-height: 90vh; overflow-y: auto;
    box-shadow: 0 8px 30px rgba(0,0,0,.2);
  }
  .modal h3 { font-size: 17px; font-weight: 500; margin-bottom: 6px; }
  .modal .desc { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-bottom: 16px; }
  .modal .actions { margin-top: 20px; justify-content: flex-end; }
  .modal-err { margin-bottom: 12px; font-size: 12px; }

  /* Segmented bar */
  .segbar {
    display: flex; background: var(--surface-hi); padding: 3px;
    border-radius: var(--r-pill); margin: 12px 0 14px; gap: 2px;
  }
  .segbar button {
    all: unset; flex: 1; text-align: center; padding: 6px 12px;
    font-size: 12.5px; font-weight: 500; color: var(--muted);
    border-radius: var(--r-pill); cursor: pointer; transition: all .15s;
  }
  .segbar button.on {
    background: var(--card); color: var(--text);
    box-shadow: 0 1px 3px rgba(60,64,67,.12);
  }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 4px; font-weight: 500; }
  .field label .req { color: var(--fail); }
  .field input, .field textarea, .field select { width: 100%; }

  .ck-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
  .ck-grid .field.wide { grid-column: 1 / -1; }
  .ck-grid .field { margin-bottom: 0; }
  .ck-grid input { font-family: var(--mono); font-size: 12px;
                   overflow: hidden; text-overflow: ellipsis; }
  .ck-extra { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.6; }
  .modal.wide { width: min(620px, 94vw); }

  @media (max-width: 1100px) { .grid-main { grid-template-columns: 1fr; } }
  @media (max-width: 900px) {
    #app { flex-direction: column; }
    .sidebar, .sidebar.collapsed { width: 100%; flex-basis: auto; height: auto;
                                   position: static; padding: 8px 12px; }
    .side-top { height: 48px; }
    .sidebar nav { flex-direction: row; overflow-x: auto; margin-top: 2px; }
    .sidebar.collapsed nav button { padding: 10px 16px; }
    .sidebar.collapsed .nav-label { display: inline; }
    .side-foot { display: none; }
    .topbar { padding: 0 14px; }
    main { padding: 4px 14px 28px; }
    .grid-2 { grid-template-columns: 1fr; }
    .chart-wrap { height: 210px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
// Empirical test range for single egress before sorry redirect: 80-180. Using 80 as conservative baseline.
const BAN_LINE = 80;
let currentUser = null;

const api = async (path, opts = {}) => {
  const r = await fetch(path, { credentials: 'include', ...opts,
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  if (r.status === 401) { renderLogin(); throw new Error('unauthorized'); }
  return r.json();
};

const fmt = {
  ts: (sec) => new Date(sec * 1000).toLocaleString('en-US', { hour12: false }),
  ms: (ms) => ms == null ? '-' : (ms < 1000 ? ms + 'ms' : (ms/1000).toFixed(2) + 's'),
  num: (n) => (n || 0).toLocaleString(),
  pct: (n) => (n * 100).toFixed(1) + '%',
};

let charts = {};
const destroyChart = (key) => { if (charts[key]) { charts[key].destroy(); delete charts[key]; } };

// ─── Pages ──────────────────────────────────────────────────────────────────

const pages = {
  dashboard: async () => {
    const stats = await api('api/stats?hours=24');
    const usage = await api('api/usage');
    return `
      <div class="kpi-row">
        <div class="kpi"><div class="label">24h Requests</div><div class="value">${fmt.num(stats.total_requests)}</div></div>
        <div class="kpi"><div class="label">Success Rate</div><div class="value">${fmt.pct(stats.success_rate)}</div>
          <div class="sub">${fmt.num(stats.success)} succeeded · ${fmt.num(stats.failures)} failed</div></div>
        <div class="kpi"><div class="label">Avg Latency</div><div class="value">${fmt.ms(stats.avg_ms)}</div></div>
        <div class="kpi"><div class="label">Input Tokens</div><div class="value">${fmt.num(stats.prompt_tokens)}</div></div>
        <div class="kpi"><div class="label">Output Tokens</div><div class="value">${fmt.num(stats.output_tokens)}</div></div>
      </div>

      <div class="grid-main">
        <div class="panel">
          <h2>Requests & Latency
            <span class="controls">
              <select id="rangeSel">
                <option value="24h">Last 24 Hours</option>
                <option value="7d">Last 7 Days</option>
                <option value="30d">Last 30 Days</option>
              </select>
            </span>
          </h2>
          <div class="chart-wrap"><canvas id="chartReq"></canvas></div>
        </div>

        <div class="stack">
        <div class="panel">
          <h2>Distance to Ban Threshold
            <span class="controls"><button onclick="refreshPage()">Refresh</button></span>
          </h2>
          <div class="slot-scroll">
            ${(usage.items || []).map(u => {
              const rph = u.rph || 0;
              const limit = u.limit_rph || 0;
              const pct = Math.min(rph / BAN_LINE * 100, 100);
              const limitPct = limit ? Math.min(limit / BAN_LINE * 100, 100) : null;
              const left = Math.max(BAN_LINE - rph, 0);
              let noteCls = '', note = `~${left} requests left`;
              if (rph >= BAN_LINE) { noteCls = 'danger'; note = 'Threshold exceeded; rate-limit block imminent'; }
              else if (rph >= BAN_LINE * 0.75) { noteCls = 'warn'; note = `Nearing threshold, ~${left} left`; }
              else if (rph === 0) { note = 'No requests this hour'; }
              return `<div class="slot">
                <div class="slot-head">
                  <span class="slot-name">${escapeHtml(u.name)}</span>
                  <span class="slot-count"><b>${rph}</b> / ${BAN_LINE}</span>
                </div>
                <div class="track">
                  <div class="fill" style="width:${pct}%"></div>
                  ${limitPct !== null ? `<div class="redline" style="left:${limitPct}%"
                    title="Local RPH limit: ${limit}"></div>` : ''}
                </div>
                <div class="slot-note ${noteCls}">${note} · Concurrency ${u.inflight}/${u.limit_concurrent || '∞'}
                  · RPM ${u.rpm}/${u.limit_rpm || '∞'} · RPH ${rph}/${u.limit_rph || '∞'}</div>
              </div>`;
            }).join('') || '<div class="empty">No requests processed yet</div>'}
          </div>
          <details class="note" style="margin:12px 0 0">
            <summary>How this threshold works</summary>

// ─── Chart ──────────────────────────────────────────────────────────────────

async function loadChart(range = '24h') {
  destroyChart('req');
  const d = await api(`api/timeseries?range=${range}`);
  const s = d.series || [];
  const ctx = document.getElementById('chartReq');
  if (!ctx) return;
  const labels = s.map(x => fmt.ts(x.bucket));
  const reqs = s.map(x => x.requests);
  const p50 = s.map(x => x.p50_ms || 0);

  charts['req'] = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: 'Requests', data: reqs, yAxisID: 'y',
          borderColor: '#4285F4', backgroundColor: 'rgba(66,133,244,.12)',
          fill: true, tension: .25, pointRadius: s.length > 50 ? 0 : 3 },
        { label: 'P50 Latency', data: p50, yAxisID: 'y1',
          borderColor: '#9B72CB', borderDash: [4, 4],
          fill: false, tension: .25, pointRadius: 0 },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { position: 'top', align: 'end', labels: { boxWidth: 12 } } },
      scales: {
        y: { type: 'linear', position: 'left', beginAtZero: true,
             grid: { color: 'rgba(0,0,0,.04)' }, ticks: { precision: 0 } },
        y1: { type: 'linear', position: 'right', beginAtZero: true,
              grid: { drawOnChartArea: false },
              ticks: { callback: v => v >= 1000 ? (v/1000).toFixed(1) + 's' : v + 'ms' } },
        x: { grid: { display: false }, ticks: { maxTicksLimit: 10 } },
      },
    },
  });
}

  const tbody = document.querySelector('#reqTable tbody');
  const items = d.items || [];
  tbody.innerHTML = items.map(r => `
    <tr>
      <td class="nw">${fmt.ts(r.ts)}</td>
      <td class="nw truncate" title="${escapeHtml(r.model)}">${escapeHtml(r.model)}</td>
      <td class="nw">${upstreamCell(r)}</td>
      <td class="nw truncate">${r.proxy_name ? escapeHtml(r.proxy_name) : '<span class="badge muted">Direct</span>'}</td>
      <td class="nw truncate" title="${escapeHtml(r.account_label || '')}">${r.account_label ? escapeHtml(r.account_label)

      <td class="nw"><span class="badge ${r.status === 200 ? 'ok' : 'fail'}">${r.status}</span></td>
      <td class="num nw">${fmt.ms(r.ttfb_ms)}</td>
      <td class="num nw">${fmt.ms(r.total_ms)}</td>
      <td class="num nw">${fmt.num(r.prompt_tokens)}</td>
      <td class="num nw">${fmt.num(r.output_tokens)}</td>
      <td style="font-family:var(--mono);font-size:12px;">${escapeHtml(r.endpoint || '/v1/chat/completions')}${r.stream ? ' <span class="badge muted">stream</span>' : ''}${r.error ? '<div class="pre err truncate" style="margin-top:3px;" title="' + escapeHtml(r.error) + '"><b>Error: </b>' + escapeHtml(r.error) + '</div>' : ''}</td>
    </tr>`).join('') || '<tr><td colspan="11" class="empty">No requests recorded yet</td></tr>';

  const total = d.total || 0;
  const page = Math.floor(reqOffset / size) + 1;
  const pages = Math.max(Math.ceil(total / size), 1);
  const from = total ? reqOffset + 1 : 0;
  const to = Math.min(reqOffset + size, total);
  document.getElementById('reqPager').innerHTML = `
    <span class="muted">${from}–${to} of ${total} records</span>
    <span class="controls">
      <button ${reqOffset <= 0 ? 'disabled' : ''}
              onclick="reqOffset=0;loadReqs()">First</button>
      <button ${reqOffset <= 0 ? 'disabled' : ''}
              onclick="reqOffset=Math.max(0,reqOffset-${size});loadReqs()">Prev</button>
      <span class="muted" style="min-width:80px;text-align:center">Page ${page} of ${pages}</span>
      <button ${reqOffset + size >= total ? 'disabled' : ''}
              onclick="reqOffset+=${size};loadReqs()">Next</button>
      <button ${reqOffset + size >= total ? 'disabled' : ''}
              onclick="reqOffset=${(pages-1)*size};loadReqs()">Last</button>
    </span>
  `;

  // populate model dropdown if first time
  const mSel = document.getElementById('reqModel');
  if (mSel && mSel.children.length <= 1) {
    const root = await fetch('../v1/models', { credentials: 'include' }).then(r => r.json()).catch(() => ({ data: [] }));
    const models = (root.data || []).map(m => m.id);
    for (const m of models) {
      const opt = document.createElement('option');
      opt.value = m;
      opt.textContent = m;
      if (m === model) opt.selected = true;
      mSel.appendChild(opt);
    }
  }
}

async function saveRtCfg() {
  const msg = document.getElementById('rtMsg');
  const payload = {};
  for (const g of RT_GROUPS) {
    for (const f of g.fields) {
      const el = document.getElementById('rt_' + f.k);
      if (!el) continue;
      if (f.type === 'bool') payload[f.k] = el.checked;
      else if (f.type === 'int') payload[f.k] = parseInt(el.value, 10) || 0;
      else payload[f.k] = el.value.trim();
    }
  }
  msg.textContent = 'Saving…'; msg.style.color = 'var(--muted)';
  try {
    const res = await fetch('api/config', {
      method: 'PUT', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok || data.error) {
      msg.textContent = 'Save failed: ' + (data.error || res.status);
      msg.style.color = 'var(--fail)';
      return;
    }
    rtCfgCache = data.config || payload;
    msg.textContent = 'Saved and applied';
    msg.style.color = 'var(--ok)';
    setTimeout(() => { if (msg.textContent === 'Saved and applied') msg.textContent = ''; }, 3000);
  } catch (e) {
    msg.textContent = 'Save failed: ' + e.message;
    msg.style.color = 'var(--fail)';
  }
}

const COOKIE_KEYS = [
  { k: '__Secure-1PSID', hint: 'Main session' },
  { k: 'SAPISID', req: true, hint: 'Used to calculate auth header; anonymous if missing' },
  { k: '__Secure-1PSIDTS', hint: 'Expires in ~30 min; automatically renewed by keep-alive' },
  { k: 'SID', hint: 'Legacy session' },
  { k: 'HSID', hint: 'Security signature' },
  { k: 'SSID', hint: 'Security signature' },
  { k: 'APISID', hint: 'Google API auth' },
];

function parseCookieStr(s) {
  const out = {};
  (s || '').split(';').forEach(p => {
    const t = p.trim();
    const i = t.indexOf('=');
    if (i > 0) out[t.slice(0, i)] = t.slice(i + 1);
  });
  return out;
}

function joinCookieObj(obj) {
  return Object.entries(obj).filter(([, v]) => (v || '').trim())
    .map(([k, v]) => `${k}=${String(v).trim()}`).join('; ');
}

async function addCookieAcct() {
  let extras = {};

  const data = await buildModal({
    title: 'Import Cookie',
    wide: true,
    desc: 'In browser: F12 → Application → Cookies → select <code>https://gemini.google.com</code>. Paste full string or fill individual fields; toggle anytime without losing data.',
    bodyHTML: `
      <div class="field">
        <label>Label</label>
        <input data-name="label" type="text" placeholder="e.g. account email, optional" />
        <div class="hint">Only used to identify account in panel; not sent with requests.</div>
      </div>

      <div class="segbar" data-role="seg">
        <button type="button" data-mode="raw" class="on">Paste Full String (Recommended)</button>
        <button type="button" data-mode="fields">Fill Individually</button>
      </div>

      <div data-pane="fields" style="display:none;">
        <div class="ck-grid">
          ${COOKIE_KEYS.map(c => `
            <div class="field${c.k.length > 12 ? ' wide' : ''}">
              <label>${escapeHtml(c.k)}${c.req ? ' <span class="req">*</span>' : ''}</label>
              <input data-ck="${escapeHtml(c.k)}" type="text" autocomplete="off" spellcheck="false"
                     placeholder="${escapeHtml(c.hint || '')}" />
            </div>`).join('')}
        </div>
        <div class="ck-extra" data-role="extras"></div>
        <div class="ck-extra">The first 3 are the minimal set for authentication; the remaining 4 ensure greater stability.
        Browsers send <b>over 20 cookies</b> per request. Since we forward the entire string verbatim
        (only parsing SAPISID for auth calculation),
        <b>pasting the full string mimics a real browser much more accurately</b>. Field mode is meant for when you only have partial items.</div>
      </div>

      <div data-pane="raw">
        <div class="field">
          <textarea data-name="cookie" rows="6" spellcheck="false"
            placeholder="SID=...; HSID=...; SSID=...; APISID=...; SAPISID=...; __Secure-1PSID=...; __Secure-1PSIDTS=..."></textarea>
          <div class="hint">Paste the full semicolon-separated cookie line. Must contain at least SAPISID and __Secure-1PSID.
          Recommended: export from Firefox (modern Chrome binds sessions to device, preventing external renewal). Select-all and copy in DevTools;
          extra cookies are retained — the fuller the string, the closer to a real browser.</div>
        </div>
      </div>

      <div class="field" style="margin-top:14px;">
        <label>Note</label>
        <input data-name="note" type="text" placeholder="Optional" />
      </div>`,
    submitText: 'Import',
    onReady: (overlay) => {
      const $ = (s) => overlay.querySelector(s);
      const inputs = () => [...overlay.querySelectorAll('[data-ck]')];
      const ta = $('[data-name=cookie]');

      const fieldsToRaw = () => {
        const obj = {};
        inputs().forEach(el => { if (el.value.trim()) obj[el.dataset.ck] = el.value.trim(); });
        ta.value = joinCookieObj({ ...obj, ...extras });
      };
      const rawToFields = () => {
        const obj = parseCookieStr(ta.value);
        const known = new Set(COOKIE_KEYS.map(c => c.k));
        extras = {};
        Object.entries(obj).forEach(([k, v]) => { if (!known.has(k)) extras[k] = v; });
        inputs().forEach(el => { el.value = obj[el.dataset.ck] || ''; });
        const n = Object.keys(extras).length;
        $('[data-role=extras]').textContent = n
          ? `${n} additional items not listed above will also be retained (${Object.keys(extras).slice(0, 4).join(', ')}${n > 4 ? ' …' : ''}).`
          : '';
      };

      overlay.querySelectorAll('[data-role=seg] button').forEach(btn => {
        btn.onclick = () => {
          const mode = btn.dataset.mode;
          if (mode === 'raw') fieldsToRaw(); else rawToFields();
          overlay.querySelectorAll('[data-role=seg] button')
            .forEach(b => b.classList.toggle('on', b === btn));
          $('[data-pane=fields]').style.display = mode === 'fields' ? '' : 'none';
          $('[data-pane=raw]').style.display = mode === 'raw' ? '' : 'none';
        };
      });
      inputs().forEach(el => el.addEventListener('paste', (ev) => {
        const txt = (ev.clipboardData || window.clipboardData).getData('text') || '';
        if (!txt.includes(';') || !txt.includes('=')) return;
        ev.preventDefault();
        ta.value = txt.trim();
        rawToFields();
      }));
    },
    onSubmit: (overlay) => {
      const label = (overlay.querySelector('[data-name=label]').value || '').trim();
      const note = (overlay.querySelector('[data-name=note]').value || '').trim();
      const isRaw = overlay.querySelector('[data-role=seg] button.on').dataset.mode === 'raw';
      let cookie;
      if (isRaw) {
        cookie = (overlay.querySelector('[data-name=cookie]').value || '').trim();
      } else {
        const obj = {};
        overlay.querySelectorAll('[data-ck]').forEach(el => {
          if (el.value.trim()) obj[el.dataset.ck] = el.value.trim();
        });
        cookie = joinCookieObj(obj);
      }
      if (!cookie) return { error: 'Cookie cannot be empty' };
      if (!cookie.includes('SAPISID')) return { error: 'Missing SAPISID in cookie; likely incomplete copy' };
      return { label, cookie, note };
    },
  });
  if (!data) return;
  const r = await fetch('api/cookies', {
    method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data),
  });
  const j = await r.json();
  if (j.error) return flash('Import failed: ' + j.error);
  flash('Cookie account imported #' + j.id);
  await refreshPage();
}

function buildModal({ title, desc, bodyHTML, submitText, danger, wide, allowEnter, onReady, onSubmit }) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true">
        ${title ? `<h3>${escapeHtml(title)}</h3>` : ''}
        ${desc ? `<div class="desc">${desc}</div>` : ''}
        <div class="modal-err" style="display:none;"></div>
        <div class="modal-body">${bodyHTML || ''}</div>
        <div class="actions">
          <button class="btn muted" data-act="cancel">Cancel</button>
          <button class="btn ${danger ? 'danger' : ''}" data-act="ok">${escapeHtml(submitText || 'OK')}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    if (onReady) onReady(overlay);

    const finish = (val) => {
      overlay.remove();
      document.removeEventListener('keydown', keyHandler);
      resolve(val);
    };
    const showErr = (msg) => {
      const e = overlay.querySelector('.modal-err');
      e.textContent = msg;
      e.style.display = msg ? 'block' : 'none';
      e.className = 'modal-err err';
    };

    overlay.querySelector('[data-act=cancel]').onclick = () => finish(null);
    overlay.querySelector('[data-act=ok]').onclick = async () => {
      const result = onSubmit ? await onSubmit(overlay) : true;
      if (result === false) return; // validation failed
      if (result && typeof result === 'object' && result.error) { showErr(result.error); return; }
      finish(result === true ? true : result);
    };
    overlay.onclick = (e) => { if (e.target === overlay) finish(null); };

    const keyHandler = (e) => {
      if (e.key === 'Escape') finish(null);
      if (e.key === 'Enter' && allowEnter && document.activeElement.tagName !== 'TEXTAREA') {
        overlay.querySelector('[data-act=ok]').click();
      }
    };
    document.addEventListener('keydown', keyHandler);

    setTimeout(() => {
      const first = overlay.querySelector('input,textarea');
      if (first) first.focus();
    }, 50);
  });
}

function modalConfirm({ title, desc, confirmText = 'OK', danger = false }) {
  return buildModal({
    title, desc, bodyHTML: '', submitText: confirmText, danger, allowEnter: true,
    onSubmit: () => true,
  });
}

function modalPrompt({ title, desc, label, placeholder = '', value = '', hint, password = false }) {
  return buildModal({
    title, desc, allowEnter: true,
    bodyHTML: `<div class="field">
      ${label ? `<label>${escapeHtml(label)}</label>` : ''}
      <input type="${password ? 'password' : 'text'}" placeholder="${escapeHtml(placeholder)}" value="${escapeHtml(value)}" />
      ${hint ? `<div class="hint">${hint}</div>` : ''}
    </div>`,
    submitText: 'OK',
    onSubmit: (overlay) => {
      const v = overlay.querySelector('input').value;
      if (!v) return { error: 'Cannot be empty' };
      return v;
    },
  });
}

function modalForm({ title, desc, fields, submitText = 'Submit' }) {
  const html = fields.map(f => `
    <div class="field">
      <label>${escapeHtml(f.label)}${f.required ? ' *' : ''}</label>
      <input data-name="${escapeHtml(f.name)}" type="${f.password ? 'password' : 'text'}"
             placeholder="${escapeHtml(f.placeholder || '')}"
             value="${escapeHtml(f.value || '')}" />
      ${f.hint ? `<div class="hint">${f.hint}</div>` : ''}
    </div>`).join('');
  return buildModal({
    title, desc, bodyHTML: html, submitText, allowEnter: true,
    onSubmit: (overlay) => {
      const out = {};
      for (const f of fields) {
        const el = overlay.querySelector(`[data-name="${f.name}"]`);
        const v = (el.value || '').trim();
        if (f.required && !v) return { error: `"${f.label}" is required` };
        if (f.minLength && v.length < f.minLength) return { error: `"${f.label}" must be at least ${f.minLength} characters` };
        out[f.name] = v;
      }
      return out;
    },
  });
}

let currentPage = null;
let pageSeq = 0;

async function switchPage(name, force = false) {
  if (!force && name === currentPage) return;
  const seq = ++pageSeq;
  currentPage = name;

  document.querySelectorAll('nav button').forEach(b =>
    b.classList.toggle('active', b.dataset.page === name));
  const titleEl = document.getElementById('pageTitle');
  if (titleEl) titleEl.textContent = PAGE_TITLES[name] || name;
  const main = document.getElementById('main');

  const slow = setTimeout(() => {
    if (seq === pageSeq) main.innerHTML = '<div class="empty">Loading…</div>';
  }, 200);
  let html;
  try {
    html = await pages[name]();
  } catch (e) {
    clearTimeout(slow);
    if (seq === pageSeq) main.innerHTML = '<div class="empty">' + e.message + '</div>';
    return;
  }
  clearTimeout(slow);
  if (seq !== pageSeq) return;
  main.innerHTML = html;

  if (name === 'dashboard') {
    await loadChart('24h');
    document.getElementById('rangeSel').onchange = (e) => loadChart(e.target.value);
    await populateTestProxies();
  }
  if (name === 'requests') {
    reqOffset = 0;
    document.getElementById('reqStatus').onchange = () => { reqOffset = 0; loadReqs(); };
    document.getElementById('reqModel').onchange = () => { reqOffset = 0; loadReqs(); };
    document.getElementById('reqSize').onchange = () => { reqOffset = 0; loadReqs(); };
    await loadReqs();
  }
  if (name === 'settings') {
    await loadRtCfg();
  }
}

function refreshPage() { return switchPage(currentPage, true); }

      const err = await r.json().catch(() => ({}));
      document.getElementById('loginErr').textContent = err.error || 'Invalid token';
      return;
    }
    await checkAuthAndBoot();
  } catch (e) {
    document.getElementById('loginErr').textContent = e.message;
  }
}

async function doRegister() {
  const username = (document.getElementById('regUsername').value || '').trim();
  const password = document.getElementById('regPassword').value || '';
  const password2 = document.getElementById('regPassword2').value || '';
  if (!username) {
    document.getElementById('loginErr').textContent = 'Username is required';
    return;
  }
  if (password.length < 6) {
    document.getElementById('loginErr').textContent = 'Password must be at least 6 characters';
    return;
  }
  if (password !== password2) {
    document.getElementById('loginErr').textContent = 'Passwords do not match';
    return;
  }
  try {
    const r = await fetch('api/register', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      document.getElementById('loginErr').textContent = err.error || 'Registration failed';
      return;
    }
    await checkAuthAndBoot();
  } catch (e) {
    document.getElementById('loginErr').textContent = e.message;
  }
}

async function checkAuthAndBoot() {
  try {
    const meRes = await fetch('api/me', { credentials: 'include' });
    if (!meRes.ok) {
      renderLogin();
      return;
    }
    const data = await meRes.json();
    currentUser = data.user || null;
    renderShell();
  } catch (e) {
    renderLogin();
  }
}

// boot
checkAuthAndBoot();
</script>
