<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 340px; margin: 0; padding: 14px 16px; font: 13px/1.5 system-ui, -apple-system, sans-serif; color: #1f1f1f; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #666; margin: 10px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #d0d4d9; border-radius: 7px; font-size: 12.5px; }
  button { width: 100%; margin-top: 12px; padding: 9px; border: 0; border-radius: 8px; background: #0b57d0; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
  button.secondary { background: #fff; color: #0b57d0; border: 1px solid #c7d4e8; margin-top: 8px; }
  button:disabled { opacity: .55; cursor: default; }
  .status { margin-top: 12px; padding: 9px 11px; border-radius: 8px; font-size: 12px; background: #f1f3f4; }
  .status.ok { background: #e6f4ea; color: #11633a; }
  .status.bad { background: #fce8e6; color: #a52714; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .tag { font-size: 11px; padding: 2px 7px; border-radius: 20px; background: #e8f0fe; color: #0b57d0; }
  .tag.miss { background: #f1f3f4; color: #80868b; }
</style>
</head>
<body>
  <h1>Gemini Cookie Sync</h1>

  <label>Panel base URL</label>
  <input id="baseUrl" placeholder="https://gemini.spacey.my.id">

  <label>Your API key</label>
  <input id="apiKey" type="password" placeholder="sk-gemini-…">

  <label>Account label (optional)</label>
  <input id="label" placeholder="you@gmail.com">

  <button id="saveBtn" class="secondary">Save settings</button>
  <button id="pushBtn">Send cookies now</button>

  <div id="status" class="status">Checking…</div>
  <div id="tags" class="row"></div>

  <script src="popup.js"></script>
</body>
</html>
